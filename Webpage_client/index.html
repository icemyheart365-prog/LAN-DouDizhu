
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN-DouDizhu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">♠ LAN<span>·</span>DouDizhu</div>

            <div class="topbar-actions">
                <div class="language-picker" id="language-picker">
                    <button
                        type="button"
                        id="language-trigger"
                        class="language-trigger"
                        aria-haspopup="true"
                        aria-expanded="false"
                    >
                        <span id="language-current">简体中文</span>
                        <span class="language-chevron"></span>
                    </button>

                    <div
                        id="language-menu"
                        class="language-menu hidden"
                        role="menu"
                    ></div>
                </div>

                <div id="connection-status"
                     class="status offline"
                     data-i18n="status.offline"></div>
            </div>
        </header>

        <section id="login-screen" class="login-panel">
            <div class="hero-icon">🃏</div>
            <h1 data-i18n="app.title"></h1>
            <p class="subtitle" data-i18n="app.subtitle"></p>

            <form id="login-form">
                <label for="server-address" data-i18n="login.serverAddress"></label>
                <input id="server-address" value="127.0.0.1" required>

                <label for="nickname" data-i18n="login.nickname"></label>
                <input id="nickname" maxlength="20" data-i18n-placeholder="login.nicknamePlaceholder" required>

                <button type="submit" class="primary-button" data-i18n="login.join"></button>
            </form>

            <p id="login-error" class="error"></p>
        </section>

        <section id="game-screen" class="game-screen hidden">
            <div class="table-info">
                <div>
                    <span class="eyebrow" data-i18n="room.eyebrow"></span>
                    <h2 data-i18n="room.title"></h2>
                </div>
                <span id="player-count">0 / 3 人</span>
            </div>

            <section class="players" id="players">
                <article class="player-slot empty">等待玩家加入</article>
                <article class="player-slot empty">等待玩家加入</article>
                <article class="player-slot empty">等待玩家加入</article>
            </section>

            <section id="table" class="table">
                <div class="table-decoration">LAN · DOU DIZHU</div>
                <div class="music-panel">
                    <span data-i18n="music.title"></span>
                    <input id="music-file" type="file" accept="audio/*">
                    <button id="music-play" type="button" data-i18n="music.play"></button>
                    <button id="music-pause" type="button" data-i18n="music.pause"></button>
                    <input id="music-volume" type="range" min="0" max="1" step="0.05" value="0.35">
                    <audio id="game-music" loop></audio>
                </div>

                <div id="game-message" class="game-message">
                    等待三名玩家加入……
                </div>
                <div id="opponent-info" class="opponent-info"></div>
                <div id="hand" class="hand"></div>
                <div id="action-controls" class="controls hidden"></div>
            </section>

            <div class="controls">
                <button
                    id="start-button"
                    class="primary-button"
                    type="button"
                    hidden
                 data-i18n="room.start">

                </button>
                <button id="ready-button" class="primary-button" disabled data-i18n="room.readyButton">

                </button>
                <button id="leave-button" class="secondary-button" data-i18n="room.leave">

                </button>
            </div>

            <p id="game-error" class="error"></p>
        </section>

        <footer>
            LAN-DouDizhu · Private LAN Game
        </footer>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/network.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
